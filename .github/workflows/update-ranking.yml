name: Deploy ranking to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore ranking checkpoint
        id: ranking-checkpoint
        uses: actions/cache/restore@v4
        with:
          path: site/ranking.json.checkpoint.json
          key: ranking-checkpoint-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ranking-checkpoint-${{ runner.os }}-

      - name: Generate ranking data
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.RANKING_TOKEN || github.token }}

      - name: Save ranking checkpoint after a failed update
        if: ${{ failure() && hashFiles('site/ranking.json.checkpoint.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: site/ranking.json.checkpoint.json
          key: ${{ steps.ranking-checkpoint.outputs.cache-primary-key }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
